name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TURBOPACK_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate sitemap
        run: npx tsx scripts/generate-sitemap.ts

      - name: Generate RSS feed
        run: npx tsx scripts/generate-feed.ts

      - name: Generate citable dataset (CSV + JSON)
        run: npx tsx scripts/generate-dataset.ts

      - name: Generate llms.txt
        run: npx tsx scripts/generate-llms.ts

      - name: Build OpenNext Worker
        run: npx opennextjs-cloudflare build

      - name: Upload & Deploy
        run: |
          VERSION=$(npx opennextjs-cloudflare upload 2>&1 | grep 'Worker Version ID:' | awk '{print $NF}')
          echo "Deploying version: $VERSION"
          npx wrangler versions deploy "${VERSION}@100%" --name offgridempire --yes
