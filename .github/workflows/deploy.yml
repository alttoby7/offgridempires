name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TURBOPACK_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate sitemap
        run: npx tsx scripts/generate-sitemap.ts

      - name: Generate RSS feed
        run: npx tsx scripts/generate-feed.ts

      - name: Generate citable dataset (CSV + JSON)
        run: npx tsx scripts/generate-dataset.ts

      - name: Generate llms.txt
        run: npx tsx scripts/generate-llms.ts

      - name: Build OpenNext Worker
        run: npx opennextjs-cloudflare build

      - name: Upload & Deploy
        run: |
          VERSION=$(npx opennextjs-cloudflare upload 2>&1 | grep 'Worker Version ID:' | awk '{print $NF}')
          echo "Deploying version: $VERSION"
          npx wrangler versions deploy "${VERSION}@100%" --name offgridempire --yes

      # Post-deploy smoke test. On 2026-06-22 a deploy left every prerendered
      # dynamic page serving 404 and rotted silently for 10 days (health score → 9,
      # 382 pages 404). Fail LOUD here so a broken deploy is caught immediately by
      # CI, not weeks later by an SEO crawl. Covers one URL per prerendered route type.
      - name: Smoke test live site
        run: |
          sleep 20
          fail=0
          for path in \
            "/" \
            "/kits/bluetti-200w-ac50p/" \
            "/best-for/cabin/" \
            "/learn/lithium-and-lifepo4-batteries/" \
            "/reports/state-of-off-grid-solar-pricing-2026/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "https://offgridempire.com${path}")
            echo "$code  $path"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          if [ "$fail" = "1" ]; then
            echo "::error::Smoke test failed — a live page did not return 200 after deploy."
            exit 1
          fi
