name: Price pipeline health watchdog

# Fails (and so notifies) when the live site's health record is stale or red.
# The droplet pipeline writes public/data/health.json every 6 h and commits it
# with the prices; a fresh record at offgridempire.com/data/health.json proves
# ingestion, export, push, build and deploy all happened. See scripts/run-pipeline.sh.

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 13:17 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and check health record
        run: |
          set -euo pipefail
          url="https://offgridempire.com/data/health.json"
          body=$(curl -sS --max-time 30 -H "Cache-Control: no-cache" "$url") || { echo "::error::could not fetch $url"; exit 1; }
          echo "$body" | jq .
          gen=$(echo "$body" | jq -r .generated_at)
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$gen" +%s) ) / 3600 ))
          echo "health record age: ${age_h}h (generated $gen)"
          fail=0
          if [ "$age_h" -gt 12 ]; then echo "::error::health record is ${age_h}h old (>12h): the pipeline, push or deploy has not completed a cycle"; fail=1; fi
          if [ "$(echo "$body" | jq -r .export_ok)" != "true" ]; then echo "::error::last export failed"; fail=1; fi
          bad=$(echo "$body" | jq -r '.ingesters | to_entries[] | select(.value.exit != 0) | .key')
          if [ -n "$bad" ]; then echo "::error::ingester(s) crashed: $bad"; fail=1; fi
          partial=$(echo "$body" | jq -r '.ingesters | to_entries[] | select(.value.failed > 0) | "\(.key)=\(.value.failed)"' | paste -sd, -)
          if [ -n "$partial" ]; then echo "::warning::items failed in last run: $partial"; fi
          exit $fail
